name: tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - develop
      - main

jobs:
  code_base_test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devhunter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Aspell
        run: sudo apt-get update && sudo apt-get install -y aspell aspell-en

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node Dependencies
        run: npm ci --force

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Configure Database
        run: |
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=devhunter_test" >> .env
          echo "DB_USERNAME=postgres" >> .env
          echo "DB_PASSWORD=postgres" >> .env

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Ensure Frontend is Well Formatted
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint

      - name: Build Assets
        run: npm run build

      - name: Ensure Typescript Types
        run: npm run types

      - name: Setup Meilisearch
        run: |
          /usr/bin/docker pull getmeili/meilisearch:v1.14
          /usr/bin/docker run -d -p 7700:7700 getmeili/meilisearch:v1.14
          sleep 10

      - name: Wait for Meilisearch to be available
        run: |
          until curl --silent http://localhost:7700/health; do
            echo "Waiting for Meilisearch to be available..."
            sleep 5
          done
          echo "Meilisearch is available."

      - name: Set Meilisearch Environment Variables
        run: |
          echo "MEILISEARCH_HOST=http://localhost:7700" >> .env
          echo "MEILISEARCH_API_KEY=your_meilisearch_api_key" >> .env

      - name: Sync Meilisearch Indexes
        run: php artisan scout:sync-index-setting

      - name: Tests
        env:
          DB_DATABASE: devhunter_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: composer test


      - name: Create Pull Request with formatting changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: format frontend"
          branch: auto/format-frontend
          delete-branch: true
          body: |
            This PR was automatically generated by CI
            to fix code formatting issues.